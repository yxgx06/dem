# Phase 3 estimator parameters. Read by egga.estimation.suite. The estimators know only the
# NOMINAL vehicle datasheet (configs/vehicle.yaml) and these numbers; never the plant internals.
# Values marked CAL are calibrated on the TRAIN scenario set (python -m egga.eval.estimation_eval
# --calibrate) and stored in configs/estimators_tuned.yaml, which overrides this file.

prior:
  mu_min: 0.10
  mu_max: 1.00
  tau_max_s: 0.15            # widest delay bound
  mass_scale_min: 1.0
  mass_scale_max: 1.9

friction:                    # EKF, state [lateral velocity, yaw rate, mu, nominal mass / mass]
  initial_mu: 0.55           # (own tanh tyre model; friction and mass are estimated jointly)
  initial_mass_scale: 1.3
  z: 2.0                     # CAL: friction interval half-width in standard deviations
  z_mass: 2.0                # CAL: mass interval half-width in standard deviations
  q_mu_per_sqrt_s: 0.05      # CAL: random-walk intensity of mu
  q_theta_per_sqrt_s: 0.005  # CAL: random-walk intensity of nominal-mass / mass
  q_vy: 0.05
  q_r: 0.02
  r_yaw_rate: 0.01           # measurement std floors (include model mismatch)
  r_ay: 0.20
  steer_noise_std: 0.002     # assumed steering-sensor noise (datasheet), propagated as input noise
  vy0_var: 0.01
  r0_var: 0.01
  mu_scale_cal: 1.0          # CAL: maps the EKF's tanh-tyre mu to the nominal mu scale
  k_safe: 1.7320508          # mu_safe = max(mu_min, mu_hat - k * sigma); sqrt(3) -> lower bound

delay:                       # cross-correlation of commanded vs measured steering
  window_s: 3.0
  update_every_s: 0.1
  max_lag_s: 0.25
  min_excitation_rad: 0.004  # std of the command over the window
  min_corr: 0.8
  margin_steps: 2.0          # CAL
  margin_frac: 0.15          # CAL
  widen_time_s: 5.0          # bound relaxes linearly to the prior after excitation is lost

staleness:
  max_gap_s: 0.1             # a measurement gap longer than this forces the widest bounds
