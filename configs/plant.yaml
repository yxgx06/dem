# Phase 1 plant defaults. Every effect is switchable; with the defaults below the plant is a
# realistic-but-mild version of the Phase 0 plant. Override per scenario (configs/plant_cases.yaml).
# Read by src/egga/plant/*.py and src/egga/eval/closed_loop.py. Vehicle constants come from
# configs/vehicle.yaml and are NOT repeated here.

tyre:
  model: pacejka            # pacejka | linear_clip (linear_clip reproduces the Phase 0 plant)
  shape_c: 1.3              # Pacejka C (lateral)
  curvature_e: 0.0          # Pacejka E; 0 keeps the force monotone up to the peak
  load_sensitivity: 0.10    # peak coefficient falls by this fraction per unit of relative extra load
  stiffness_scale: 1.0      # multiplies cornering stiffness (both axles)

load_transfer:
  enabled: true
  track_width_m: 1.6
  front_roll_share: 0.55    # share of lateral load transfer taken by the front axle
  longitudinal: true        # pitch transfer from ax

mass:
  mass_scale: 1.0           # x1.0 .. x1.9 stress range
  inertia_scale: null       # null -> follows mass_scale

actuator:
  delay_s: 0.0
  jitter_s: 0.0             # delay is delay_s + U(0, jitter_s) each step
  lag_tau_s: 0.0            # first-order lag time constant; 0 disables
  gain: 1.0                 # gain loss: < 1
  bias_rad: 0.0

# Per-signal sensors: noise (std), bias, quantisation step (0 = none), dropout probability,
# sample delay in steps. Defaults are ideal sensors.
sensors:
  lateral_error:  {noise_std: 0.0, bias: 0.0, quant_step: 0.0, dropout_prob: 0.0, delay_steps: 0}
  yaw_rate:       {noise_std: 0.0, bias: 0.0, quant_step: 0.0, dropout_prob: 0.0, delay_steps: 0}
  steering_angle: {noise_std: 0.0, bias: 0.0, quant_step: 0.0, dropout_prob: 0.0, delay_steps: 0}
  lateral_accel:  {noise_std: 0.0, bias: 0.0, quant_step: 0.0, dropout_prob: 0.0, delay_steps: 0}

friction:                   # null -> use the mission's own mu array
  profile: null
  split_mu: {enabled: false, left_factor: 1.0, right_factor: 1.0}

crosswind:
  speed_mps: 0.0            # signed side wind
  gust_amp_mps: 0.0
  gust_period_s: 5.0
  side_force_area_m2: 2.2   # Cs * A in F = 0.5 * rho * Cs*A * w|w|
  air_density: 1.2
  aero_centre_offset_m: 0.3 # centre of pressure ahead of the CG (yaw moment arm)

controller:
  derivative_cutoff_hz: 5.0 # filtered derivative used by every controller in closed_loop runs
  # (null reproduces the legacy finite difference)

speed:
  profile: constant         # constant | ramp
  constant_mps: null        # null -> mission vx_mps
  ramp: {v_start_mps: 10.0, v_end_mps: 12.0, t_start_s: 0.0, t_end_s: 75.0}
