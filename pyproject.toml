[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "egga"
version = "0.1.0"
description = "EGGA: envelope-guarded gain adaptation for steering control (research prototype)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pyyaml>=6.0",
    "pandas>=2.1",
    "pyarrow>=14.0",
    "osqp>=0.6",
    "torch>=2.14.1",
    "gymnasium>=1.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "ruff>=0.5",
    "mypy>=1.10",
]

[tool.hatch.build.targets.wheel]
packages = ["src/egga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "NPY"]

[dependency-groups]
dev = [
    "pytest-cov>=7.1.0",
]
